[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prospect-audit"
version = "0.1.0"
description = "Offline-first website and phone-line evidence inspection primitives."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
prospect-audit = "prospect_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
